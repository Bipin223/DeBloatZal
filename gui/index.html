<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeBloatZal</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div class="desktop">
  <div class="island" id="island">

    <div class="titlebar" id="titlebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4.5 6v5.4c0 4.5 3.1 7.9 7.5 9.6 4.4-1.7 7.5-5.1 7.5-9.6V6L12 3Z"/>
            <path d="m9 12 2.1 2.1L15.4 10"/>
          </svg>
        </div>
        <span class="brand-name">DeBloatZal</span>
        <span class="ui-version">v17</span>
      </div>
      <div class="win-buttons">
        <button class="win-btn" id="minBtn" title="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button class="win-btn" id="maxBtn" title="Maximize">
          <svg class="max-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="1.6"/></svg>
          <svg class="restore-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="9" width="9" height="9" rx="1.4"/><path d="M9 6h7.4A1.6 1.6 0 0 1 18 7.6V15"/></svg>
        </button>
        <button class="win-btn win-close" id="closeBtn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
    </div>

    <section class="devicebar">
      <div class="device-mini">
        <span class="status-dot" id="statusDot"></span>
        <span class="device-model" id="deviceName">No phone connected</span>
        <span class="device-os" id="deviceMeta">Enable USB debugging and press refresh.</span>
        <span class="warning" id="warning" hidden></span>
      </div>
      <div class="device-tools">
        <div class="profile-wrap">
          <button class="profile-pill" id="profileBtn" disabled>
            <span class="mini-dot"></span>
            <span id="profileLabel">No profile</span>
            <svg class="chevy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m8 10 4 4 4-4"/></svg>
          </button>
          <div class="menu" id="profileMenu" hidden></div>
        </div>
        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/>
          </svg>
        </button>
        <button class="icon-btn" id="powerBtn" title="Reboot phone" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v8"/><path d="M7.4 6.4a7.5 7.5 0 1 0 9.2 0"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="summary">
      <button class="sum" data-jump="recommended">
        <span class="dot green"></span><span class="sum-value" id="statSafe">0</span><span class="sum-label">safe</span>
      </button>
      <button class="sum" data-jump="optional">
        <span class="dot blue"></span><span class="sum-value" id="statOptional">0</span><span class="sum-label">optional</span>
      </button>
      <button class="sum" data-jump="critical">
        <span class="dot red"></span><span class="sum-value" id="statCritical">0</span><span class="sum-label">critical</span>
      </button>
      <button class="sum" data-jump="removed">
        <span class="dot orange"></span><span class="sum-value" id="statRemoved">0</span><span class="sum-label">removed</span>
      </button>
      <button class="sum" data-jump="all">
        <span class="dot white"></span><span class="sum-value" id="statSelected">0</span><span class="sum-label">selected</span>
      </button>
    </section>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="searchInput" type="text" placeholder="Search app or package" spellcheck="false" autocomplete="off">
        <span class="search-scope" id="searchScope" hidden>ALL</span>
        <button class="search-clear" id="searchClear" title="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m8 8 8 8M16 8l-8 8"/></svg>
        </button>
      </label>
      <button class="filter-chip" id="userAppsBtn" title="Only apps you installed yourself">
        <span class="chip-dot"></span>My apps <span class="chip-count" id="userAppsCount">0</span>
      </button>
      <div class="segmented" id="viewSegments">
        <span class="seg-thumb" id="viewThumb"></span>
        <button data-view="recommended" class="active">Recommended</button>
        <button data-view="optional">Optional</button>
        <button data-view="critical">Critical</button>
        <button data-view="all">All</button>
        <button data-view="removed">Removed</button>
      </div>
    </div>

    <div class="list-meta">
      <span id="listSection">Recommended</span>
      <span id="listCount">0 packages</span>
    </div>

    <main class="content">
      <section class="list-pane">
        <div class="list" id="list"></div>
        <div class="empty" id="empty" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="6" y="2.8" width="12" height="18.4" rx="2.6"/><path d="M11 18.2h2"/></svg>
          </div>
          <div class="empty-title" id="emptyTitle">Nothing here</div>
          <div class="empty-text" id="emptyText">Connect a phone and press refresh.</div>
          <button class="ghost empty-action" id="emptyAction">Refresh</button>
        </div>
        <div class="loading" id="loading">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="loading-label" id="loadingText">Reading packages&hellip;</div>
        </div>
      </section>
      <aside class="detail" id="detail"></aside>
    </main>

    <footer class="footer">
      <span class="footer-note" id="footerNote">No changes yet</span>
      <div class="footer-actions">
        <button class="ghost" id="selectSafeBtn" disabled>Select recommended</button>
        <button class="ghost" id="clearBtn" disabled>Clear</button>
        <button class="pill danger" id="applyBtn" disabled>Remove 0</button>
        <button class="pill success" id="restoreBtn" disabled>Restore 0</button>
      </div>
    </footer>

    <div class="top-progress" id="topProgress"><div id="topProgressBar"></div></div>
    <div class="demo-chip" id="demoChip" hidden>PREVIEW</div>
    <div class="toast" id="toast"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-text" id="modalText"></div>
        <div class="modal-actions">
          <button class="ghost" id="modalCancel">Cancel</button>
          <button class="pill danger" id="modalOk">Confirm</button>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="app.js?v=17"></script>
</body>
</html>
